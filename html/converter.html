<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <title>Converter · Tooling & Node Runtime WorkspaceSerializer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 24px;
            min-height: 100vh;
            line-height: 1.5;
        }

        .wrap {
            max-width: 960px;
            width: 100%;
            background: #111;
            padding: 28px 30px 32px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #282828;
            padding-bottom: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .head h1 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .head h1 svg {
            flex-shrink: 0;
        }

        .head h2 {
            font-size: 15px;
            font-weight: 400;
            color: #aaa;
            letter-spacing: 0.2px;
        }

        .lang {
            display: flex;
            gap: 4px;
            background: #1a1a1a;
            border-radius: 6px;
            padding: 3px;
            border: 1px solid #2a2a2a;
        }

        .lang button {
            background: transparent;
            border: none;
            color: #666;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .lang button.active {
            background: #2a2a2a;
            color: #fff;
        }

        .lang button:hover:not(.active) {
            color: #aaa;
        }

        .links-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 6px 0;
            border-bottom: 1px solid #1e1e1e;
        }

        .links-row a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #888;
            text-decoration: none;
            transition: 0.2s;
            background: #161616;
            border: 1px solid #242424;
        }

        .links-row a:hover {
            color: #ddd;
            background: #222;
            border-color: #3a3a3a;
        }

        .links-row a svg {
            flex-shrink: 0;
            opacity: 0.6;
            transition: 0.2s;
        }

        .links-row a:hover svg {
            opacity: 1;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        .field .hint {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }

        textarea {
            width: 100%;
            height: 170px;
            background: #0d0d0d;
            color: #ccc;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 12px 14px;
            font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
            font-size: 13px;
            resize: vertical;
            transition: border 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #3a3a3a;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .file-row input[type="file"] {
            color: #888;
            font-size: 13px;
            padding: 4px 0;
        }

        .file-row input[type="file"]::file-selector-button {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #ccc;
            padding: 6px 18px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .file-row input[type="file"]::file-selector-button:hover {
            background: #282828;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0 16px;
        }

        .actions button {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #ddd;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 0 auto;
            min-width: 140px;
            justify-content: center;
        }

        .actions button svg {
            flex-shrink: 0;
        }

        .actions button:hover:not(:disabled) {
            background: #282828;
            border-color: #3a3a3a;
        }

        .actions button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .actions button.primary {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }

        .actions button.primary:hover:not(:disabled) {
            background: #3a3a3a;
            border-color: #4a4a4a;
        }

        .actions button.danger:hover:not(:disabled) {
            border-color: #553333;
            background: #221111;
        }

        .actions button.toggle-on {
            border-color: #3a7a3a;
            background: #1a2a1a;
            color: #8bc34a;
        }

        .actions button.toggle-on:hover:not(:disabled) {
            background: #223a22;
            border-color: #4a9a4a;
        }

        .actions button.toggle-off {
            border-color: #7a3a3a;
            background: #2a1a1a;
            color: #e88484;
        }

        .actions button.toggle-off:hover:not(:disabled) {
            background: #3a2222;
            border-color: #9a4a4a;
        }

        .status {
            background: #0d0d0d;
            border-left: 3px solid #2a2a2a;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'JetBrains Mono', Consolas, monospace;
            color: #999;
            margin-top: 6px;
            min-height: 44px;
            white-space: pre-wrap;
            word-break: break-word;
            transition: border-color 0.3s;
        }

        .status.ok {
            border-left-color: #4a7a4a;
            color: #8bc34a;
        }

        .status.err {
            border-left-color: #7a3a3a;
            color: #e88484;
        }

        .status.info {
            border-left-color: #3a5a7a;
            color: #7ab8e8;
        }

        .preview {
            width: 100%;
            height: 280px;
            background: #0d0d0d;
            color: #8bc34a;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 12px 14px;
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            overflow: auto;
            margin-top: 12px;
            display: none;
        }

        .preview.visible {
            display: block;
        }

        .example-link {
            color: #6a8cff;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            border-bottom: 1px dashed #3a4a7a;
            padding-bottom: 1px;
            display: inline-block;
            margin-top: 4px;
        }

        .example-link:hover {
            color: #8aa8ff;
            border-bottom-color: #5a7aaa;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #1e1e1e;
            font-size: 11px;
            color: #444;
        }

        .footer-links a {
            color: #555;
            text-decoration: none;
            transition: 0.2s;
        }

        .footer-links a:hover {
            color: #888;
        }

        @media (max-width: 600px) {
            .wrap {
                padding: 18px 16px 22px;
            }

            .head {
                flex-direction: column;
                align-items: flex-start;
            }

            .head h2 {
                font-size: 13px;
            }

            .links-row a {
                font-size: 11px;
                padding: 4px 10px;
            }

            .actions button {
                min-width: 100px;
                padding: 8px 16px;
                font-size: 12px;
            }

            textarea {
                height: 130px;
                font-size: 12px;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0d0d0d;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="head">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <img src="favicon.png" alt="logo" width="44" height="44">
                <h2>TNR - WorkspaceSerializer to RBXMX</h2>
            </div>
            <div class="lang" id="langToggle">
                <button data-lang="en" class="active">EN</button>
                <button data-lang="uk">UA</button>
            </div>
        </div>

        <div class="links-row">
            <a href="#" target="_blank">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h12"/></svg>
                Docs

            <a href="https://github.com/Bondpley/Tooling-Node-Runtime-WorkspaceSerializer/" target="_blank">

                GitHub
            </a>
            <a href="https://github.com/Bondpley/Tooling-Node-Runtime-WorkspaceSerializer/graphs/contributors" target="_blank">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Creators
            </a>
            <a href="https://github.com/Bondpley/Tooling-Node-Runtime-WorkspaceSerializer/blob/main/Readme.md" target="_blank">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Support
            </a>
            <a href="https://github.com/Bondpley/Tooling-Node-Runtime-WorkspaceSerializer/blob/main/Readme.md" target="_blank">

                Changelog
            </a>
        </div>

        <div class="field">
            <label data-key="fileLabel">Load JSON file</label>
            <div class="file-row">
                <input type="file" id="fileInput" accept=".json,.txt">
                <span class="hint" data-key="fileHint">handles large files via background worker</span>
            </div>
        </div>

        <div class="field">
            <label data-key="pasteLabel">… or paste JSON manually</label>
            <textarea id="jsonInput" data-key="placeholder" placeholder='[{"Class":"MeshPart","Name":"MyMesh","Properties":{...}}]'></textarea>
            <span class="example-link" id="loadExample" data-key="exampleLink">load sample</span>
        </div>

        <div class="actions">
            <button class="primary" id="convertBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span data-key="convertBtn">Convert & Download</span>
            </button>
            <button id="previewBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <span data-key="previewBtn">Preview XML</span>
            </button>
            <button id="meshToggle" class="toggle-on">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                <span>Meshes: ON</span>
            </button>
            <button class="danger" id="clearBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span data-key="clearBtn">Clear</span>
            </button>
        </div>

        <div id="status" class="status" data-key="statusReady">Ready</div>
        <div id="xmlPreview" class="preview"></div>

        <div class="footer-links">
            <span>v1.3.0</span>
            <a href="https://raw.githubusercontent.com/Bondpley/Tooling-Node-Runtime-WorkspaceSerializer/refs/heads/main/LICENSE">License</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>

    <script>
        (function() {
            var fileInput = document.getElementById('fileInput');
            var jsonInput = document.getElementById('jsonInput');
            var statusEl = document.getElementById('status');
            var convertBtn = document.getElementById('convertBtn');
            var previewBtn = document.getElementById('previewBtn');
            var clearBtn = document.getElementById('clearBtn');
            var meshToggle = document.getElementById('meshToggle');
            var xmlPreview = document.getElementById('xmlPreview');
            var langToggle = document.getElementById('langToggle');

            var lastResult = null;
            var activeLang = 'en';
            var exportMeshes = true;

            var strings = {
                en: {
                    statusReady: 'Ready. Load a file or paste JSON.',
                    statusCleared: 'Cleared.',
                    statusSample: 'Sample loaded (size & InitialSize will be added).',
                    statusNoInput: 'Select a file or paste JSON.',
                    statusReading: 'Reading file…',
                    statusReadError: 'Failed to read file.',
                    statusProcessing: 'Processing… {p}%',
                    statusError: 'Error: {m}',
                    statusDone: 'Done! Objects: {c}.',
                    statusTerrain: 'Terrain skipped: {t}.',
                    statusSkipped: 'Skipped properties (unknown enum): {n}.',
                    statusSkippedList: '{list}',
                    statusMeshes: 'Meshes skipped: {m}.',
                    convertBtn: 'Convert & Download',
                    previewBtn: 'Preview XML',
                    clearBtn: 'Clear',
                    fileLabel: 'Load JSON file',
                    fileHint: 'handles large files via background worker',
                    pasteLabel: '… or paste JSON manually',
                    placeholder: '[{"Class":"MeshPart","Name":"MyMesh","Properties":{...}}]',
                    exampleLink: 'load sample',
                },
                uk: {
                    statusReady: 'Готово. Завантажте файл або вставте JSON.',
                    statusCleared: 'Очищено.',
                    statusSample: 'Приклад завантажено (size та InitialSize додадуться).',
                    statusNoInput: 'Виберіть файл або вставте JSON.',
                    statusReading: 'Читання файлу…',
                    statusReadError: 'Не вдалося прочитати файл.',
                    statusProcessing: 'Обробка… {p}%',
                    statusError: 'Помилка: {m}',
                    statusDone: 'Готово! Об\'єктів: {c}.',
                    statusTerrain: 'Terrain пропущено: {t}.',
                    statusSkipped: 'Пропущено властивостей (невідомий Enum): {n}.',
                    statusSkippedList: '{list}',
                    statusMeshes: 'Пропущено мешів: {m}.',
                    convertBtn: 'Конвертувати і завантажити',
                    previewBtn: 'Показати XML',
                    clearBtn: 'Очистити',
                    fileLabel: 'Завантажити JSON файл',
                    fileHint: 'великі файли обробляються у фоновому потоці',
                    pasteLabel: '… або вставте JSON вручну',
                    placeholder: '[{"Class":"MeshPart","Name":"MyMesh","Properties":{...}}]',
                    exampleLink: 'завантажити приклад',
                }
            };

            function t(key, vars) {
                var dict = strings[activeLang] || strings.en;
                var val = dict[key] || key;
                if (vars) {
                    for (var k in vars) {
                        val = val.replace('{' + k + '}', vars[k]);
                    }
                }
                return val;
            }

            function setStatus(msg, type) {
                statusEl.textContent = msg;
                statusEl.className = 'status' + (type ? ' ' + type : '');
            }

            function updateLang() {
                var els = document.querySelectorAll('[data-key]');
                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    var key = el.getAttribute('data-key');
                    var val = t(key);
                    if (el.tagName === 'INPUT' && el.type === 'file') {
                        continue;
                    }
                    if (el.tagName === 'TEXTAREA') {
                        el.placeholder = val;
                    } else if (el.tagName === 'BUTTON') {
                        var span = el.querySelector('span[data-key]');
                        if (span) span.textContent = val;
                    } else {
                        el.textContent = val;
                    }
                }
                var btns = document.querySelectorAll('.actions button');
                for (var j = 0; j < btns.length; j++) {
                    var b = btns[j];
                    var sp = b.querySelector('span[data-key]');
                    if (sp) {
                        var k = sp.getAttribute('data-key');
                        sp.textContent = t(k);
                    }
                }
                updateMeshToggleLabel();
            }

            function updateMeshToggleLabel() {
                var span = meshToggle.querySelector('span');
                if (exportMeshes) {
                    span.textContent = 'Meshes: ON';
                    meshToggle.className = 'toggle-on';
                } else {
                    span.textContent = 'Meshes: OFF';
                    meshToggle.className = 'toggle-off';
                }
            }

            meshToggle.addEventListener('click', function() {
                exportMeshes = !exportMeshes;
                updateMeshToggleLabel();
                var cur = statusEl.textContent;
                if (cur && (cur.indexOf('Ready') > -1 || cur.indexOf('Готово') > -1 || cur.indexOf('Meshes') > -1)) {
                    setStatus(t('statusReady'), '');
                }
            });

            langToggle.addEventListener('click', function(e) {
                var btn = e.target.closest('button');
                if (!btn) return;
                var lang = btn.getAttribute('data-lang');
                if (!lang || lang === activeLang) return;
                activeLang = lang;
                var all = langToggle.querySelectorAll('button');
                for (var i = 0; i < all.length; i++) {
                    all[i].classList.toggle('active', all[i].getAttribute('data-lang') === lang);
                }
                updateLang();
                var cur = statusEl.textContent;
                if (cur) {
                    var parts = cur.split('\n');
                    var first = parts[0] || '';
                    if (first.indexOf('Ready') > -1 || first.indexOf('Готово') > -1) {
                        setStatus(t('statusReady'), '');
                    }
                }
            });

            document.getElementById('loadExample').addEventListener('click', function() {
                jsonInput.value = JSON.stringify([{
                    Class: "MeshPart",
                    Name: "CustomMesh",
                    Properties: {
                        Size: ["V3", 4, 4, 4],
                        CFrame: ["CF", 0, 5, 0, 0, 0, -1, 0, 1, 0],
                        Color: ["C3", 1, 0.2, 0.3],
                        Material: ["EN", "Material", "Plastic"],
                        MeshId: "rbxassetid://123456789",
                        TextureId: "rbxassetid://987654321",
                        TextureID: "rbxassetid://111222333",
                        VertexColor: ["C3", 1, 1, 1],
                        Anchored: true,
                        Transparency: 0,
                        RenderFidelity: ["EN", "RenderFidelity", "Automatic"],
                        CollisionFidelity: ["EN", "CollisionFidelity", "PreciseConvexDecomposition"]
                    },
                    Children: []
                }], null, 2);
                setStatus(t('statusSample'), 'ok');
            });

            clearBtn.addEventListener('click', function() {
                jsonInput.value = '';
                fileInput.value = '';
                xmlPreview.className = 'preview';
                setStatus(t('statusCleared'), '');
            });

            var workerSrc = `
const MATERIAL_ID = {
    Plastic:256, SmoothPlastic:272, Neon:288, Wood:512, WoodPlanks:528,
    Marble:784, Basalt:788, Slate:800, CrackedLava:804, Concrete:816,
    Limestone:820, Granite:832, Pavement:836, Brick:848, Pebble:864,
    Cobblestone:880, Rock:896, Sandstone:912, CorrodedMetal:1040,
    DiamondPlate:1056, Foil:1072, Metal:1088, Grass:1280, LeafyGrass:1284,
    Sand:1296, Fabric:1312, Snow:1328, Mud:1344, Ground:1360, Asphalt:1376,
    Salt:1392, Ice:1536, Glacier:1552, Glass:1568, ForceField:1584,
    Air:1792, Water:2048, Cardboard:2304, Carpet:2305, CeramicTiles:2306,
    ClayRoofTiles:2307, RoofShingles:2308, Leather:2309, Plaster:2310, Rubber:2311
};

const ENUM_TABLES = {
    Material: MATERIAL_ID,
    PartType: {Ball:0, Block:1, Cylinder:2, Wedge:3, CornerWedge:4},
    NormalId: {Right:0, Top:1, Back:2, Left:3, Bottom:4, Front:5},
    ResamplerMode: {Default:0, Pixelated:1},

            var worker = null;

            function getWorker() {
                var blob = new Blob([workerSrc], { type: 'application/javascript' });
                return new Worker(URL.createObjectURL(blob));
            }

            function download(chunks) {
                var blob = new Blob(chunks, { type: 'application/xml;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'map.rbxmx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 10000);
            }

            function runConversion(text, showPreview) {
                convertBtn.disabled = true;
                previewBtn.disabled = true;
                setStatus(t('statusProcessing', { p: 0 }), 'info');
                if (worker) { worker.terminate(); }
                worker = getWorker();
                worker.onmessage = function(e) {
                    var msg = e.data;
                    if (msg.progress !== undefined) {
                        setStatus(t('statusProcessing', { p: msg.progress }), 'info');
                    } else if (msg.error) {
                        setStatus(t('statusError', { m: msg.error }), 'err');
                        convertBtn.disabled = false;
                        previewBtn.disabled = false;
                        worker.terminate();
                        worker = null;
                    } else if (msg.done) {
                        lastResult = msg.chunks.join('\n');
                        if (showPreview) {
                            xmlPreview.textContent = lastResult;
                            xmlPreview.className = 'preview visible';
                        } else {
                            download(msg.chunks);
                        }
                        var s = t('statusDone', { c: msg.count });
                        if (msg.terrainSkipped) {
                            s += '\n' + t('statusTerrain', { t: msg.terrainSkipped });
                        }
                        if (msg.meshesSkipped) {
                            s += '\n' + t('statusMeshes', { m: msg.meshesSkipped });
                        }
                        if (msg.skipped && msg.skipped.length) {
                            var list = msg.skipped.slice(0, 10).join(', ') + (msg.skipped.length > 10 ? '…' : '');
                            s += '\n' + t('statusSkipped', { n: msg.skipped.length }) + '\n' + list;
                        }

                        convertBtn.disabled = false;
                        previewBtn.disabled = false;
                        worker.terminate();
                        worker = null;
                    }

                    setStatus(t('statusError', { m: e.message }), 'err');
                    convertBtn.disabled = false;
                    previewBtn.disabled = false;
                    worker = null;
                };
                worker.postMessage({ text: text, exportMeshes: exportMeshes });

            function handleConvert(showPreview) {
                var file = fileInput.files[0];
                if (file) {
                    setStatus(t('statusReading'), 'info');
                    var reader = new FileReader();
                    reader.onload = function() {
